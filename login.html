<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Painel de Cobranças</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1630;--mut:#6b7690;--line:#e3e8f2;--pri:#2f5bff;--pri2:#e9eeff;--bad:#d64545;--bad2:#fde8e8;--ok:#0e9f6e}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1630;overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite}
.b1{width:420px;height:420px;background:#2f5bff;top:-120px;left:-100px}
.b2{width:360px;height:360px;background:#12c28b;bottom:-120px;right:-80px;animation-delay:-5s}
.b3{width:260px;height:260px;background:#7a4dff;top:45%;left:60%;animation-delay:-9s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,40px) scale(1.12)}66%{transform:translate(-40px,60px) scale(.94)}}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:#ffffffee;backdrop-filter:blur(18px);border-radius:24px;padding:38px 32px 30px;text-align:center;box-shadow:0 30px 80px #00000055;animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}}
.logo{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,#2f5bff,#12c28b);display:grid;place-items:center;box-shadow:0 14px 34px #2f5bff55;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
.logo svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
p.s{color:var(--mut);margin:6px 0 26px;font-size:14px;line-height:1.5}
.g{width:100%;display:flex;gap:12px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .2s;position:relative;overflow:hidden}
.g:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#2f5bff14 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s}
.g:hover:before{transform:translateX(100%)}
.g:hover{transform:translateY(-3px);box-shadow:0 14px 30px #2f5bff2a;border-color:#c9d2e6}
.g:active{transform:scale(.97)}
.g:disabled{opacity:.65;pointer-events:none}
.g svg{width:22px;height:22px;flex:none}
.spin{width:20px;height:20px;border:3px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.msg{display:none;gap:10px;align-items:flex-start;text-align:left;background:var(--bad2);color:#8f2727;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;animation:shake .5s}
.msg.on{display:flex}
.msg svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.sec{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--mut);font-size:12.5px;margin-top:20px}
.sec svg{width:16px;height:16px;stroke:var(--ok);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main class="card">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M4 9h16M15.5 14.5h2"/></svg></div>
  <h1>Painel de Cobranças</h1>
  <p class="s">Entre com sua conta Google para gerar e acompanhar pagamentos.</p>

  <div class="msg" id="msg"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17.5v.01"/></svg><span id="msgt"></span></div>

  <button class="g" id="entrar">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    <span id="btxt">Entrar com Google</span>
  </button>

  <div class="sec"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6z"/><path d="M8.7 12.2l2.2 2.2 4.4-4.6"/></svg>Acesso restrito a contas autorizadas</div>
</main>

<script type="module">
import {auth,temAcesso} from './firebase.js';
const G='https://www.gstatic.com/firebasejs/10.14.1/';
const {GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}=await import(G+'firebase-auth.js');
const $=s=>document.querySelector(s);
const btn=$('#entrar');
function erro(t){$('#msgt').textContent=t;const m=$('#msg');m.classList.remove('on');void m.offsetWidth;m.classList.add('on')}
function busy(on){btn.disabled=on;$('#btxt').textContent=on?'Verificando...':'Entrar com Google';
  const s=btn.querySelector('svg');s.style.display=on?'none':'';
  const sp=btn.querySelector('.spin');if(on&&!sp){const i=document.createElement('i');i.className='spin';btn.prepend(i)}if(!on&&sp)sp.remove()}

if(new URLSearchParams(location.search).get('negado'))erro('Este e-mail não tem permissão para usar o painel. Peça liberação ao administrador.');

btn.onclick=async()=>{
  busy(true);
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p)}
  catch(e){
    busy(false);
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
    if(e.code==='auth/popup-blocked')return erro('O navegador bloqueou a janela de login. Permita pop-ups e tente de novo.');
    if(e.code==='auth/unauthorized-domain')return erro('Este domínio não está autorizado no Firebase (Authentication → Configurações → Domínios autorizados).');
    erro('Não foi possível entrar. Tente novamente.');
  }
};

onAuthStateChanged(auth,async u=>{
  if(!u)return;
  busy(true);
  if(await temAcesso(u))return location.replace('index.html');
  await signOut(auth);busy(false);
  erro('A conta '+u.email+' não tem permissão para usar o painel.');
});
</script>
</body>
</html>
